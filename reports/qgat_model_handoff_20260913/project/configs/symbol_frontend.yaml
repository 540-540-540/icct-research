revision: A03-symbol-v4-cuda-stable-solver
source: Wei et al IEEE TVT2024 DOI10.1109/TVT.2023.3304856
scope: Known separated targets, independently sensed then grouped into up to8; no
  blind detection or association claims
waveform:
  fc: 24000000000.0
  B: 93100000.0
  K: 256
  N: 256
  T: 1.2375e-05
  c: 299792458.0
paper_reference_K: 128
stations:
- - -64.23372566
  - -106.90678644
- - 114.23372566
  - 0.0
- - -64.23372566
  - 106.90678644
xy_bounds:
- - -36.16928234
  - 38.70861686000001
- - -254.37510704
  - 255.11284496000005
v_bounds:
- - -40.0
  - 40.0
- - -40.0
  - 40.0
bounds_source: Retained training position extrema plus5m each axis; velocity domain
  predeclared +/-40m/s each axis
max_corner_range_m: 376.37127866310004
snr_db:
- 5
- 10
- 15
- 20
nominal_snr_db: 20
snr_definition: 'Per complex received OFDM symbol entry before processing: E|a X|^2/E|noise|^2;
  unit QPSK; received amplitude10^(SNR/20), complex noise variance1; each BS same
  controlled received SNR'
height_model: 2D common plane as paper, no old ULA AoA channel
time_model: Snapshot at deadline, constant target parameters within symbol burst ending
  by deadline; no future source rows
target_access: Ideal target separation and known current correspondence assumed by
  user; not a modeled multi-target discovery mechanism
power_resource_model: Independent target-conditioned sensing experiments; not a full
  shared-bandwidth multiuser link budget
seed_recipe: 'For each episode/frame/slot: int.from_bytes(SHA256(ASCII 2026:episode:frame:slot:101)[:8],little)&(2^63-1);
  independent CUDA generator per target; same seed across SNR. GPU RNG is reproducible
  but not sample-identical to previous NumPy noise.'
search:
  oversample: 2
  position_half_width: 3.0
  position_step: 0.25
  position_fine_step: 0.025
  velocity_half_width: 3.0
  velocity_step: 0.25
  velocity_fine_step: 0.025
snr_selection: User requested historical experiment levels5/10/15/20dB; nominal20;
  current symbol-level received-SNR definition retained, not equivalence to historical
  faded RF noise model
compute_backend: torch CUDA; float64/complex128; no CPU estimator fallback
solver_revision: Stable rationalized range/objective difference for accepted steps;
  unchanged float64 convergence tolerances and search steps
